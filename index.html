<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>


<header>
    <h1>TaskFlow</h1>
    <p>Organize your tasks, one step at a time.</p>
</header>

<main>

    <!-- Task Statistics -->
    <section id="statistics">
        <h2>Task Statistics</h2>

        <div class="stats-container">
            <div>
                <h3>Total Tasks</h3>
                <p id="total-tasks">0</p>
            </div>

            <div>
                <h3>Completed</h3>
                <p id="completed-tasks">0</p>
            </div>

            <div>
                <h3>Pending</h3>
                <p id="pending-tasks">0</p>
            </div>
        </div>
    </section>

    <!-- Create Task Form -->
    <section id="create-task">
        <h2>Create a New Task</h2>

        <form id="task-form">

            <div>
                <label for="task-title">Title</label>
                <input
                    type="text"
                    id="task-title"
                    name="title"
                    placeholder="Enter task title"
                    required
                >
            </div>

            <div>
                <label for="task-description">Description</label>
                <textarea
                    id="task-description"
                    name="description"
                    placeholder="Enter task description"
                ></textarea>
            </div>

            <div>
                <label for="task-priority">Priority</label>
                <select id="task-priority" name="priority" required>
                    <option value="">Select priority</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
            </div>

            <button type="submit">Add Task</button>

        </form>
    </section>

    <!-- Search and Filters -->
    <section id="task-controls">
        <h2>Manage Tasks</h2>

        <input
            type="search"
            id="search-input"
            placeholder="Search tasks..."
        >

        <div id="filter-buttons">
            <button type="button" data-filter="all">All</button>
            <button type="button" data-filter="completed">Completed</button>
            <button type="button" data-filter="pending">Pending</button>
        </div>
    </section>

    <!-- Task List -->
    <section id="task-list-section">
        <h2>Your Tasks</h2>

        <div id="task-list">
            <!-- Tasks will be displayed here using JavaScript -->
        </div>
    </section>

</main>

<footer>
    <p>TaskFlow &copy; 2026</p>
</footer>

</body>
</html>
